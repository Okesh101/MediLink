# version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: local_medilink_db
    restart: always
    environment:
      POSTGRES_USER: dev_user_medilink
      POSTGRES_PASSWORD: dev_password_medilink
      POSTGRES_DB: medilink_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    container_name: medilink_redis
    restart: always
    ports:
      - "6382:6379"

volumes:
  postgres_data:
    
